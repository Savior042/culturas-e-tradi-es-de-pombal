<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Manifestações Culturais</title>

<style>

*{
box-sizing:border-box;
font-family:Segoe UI, Arial;
}

body{
margin:0;
background:#0f0f0f;
color:white;
}

header{
text-align:center;
padding:40px;
background:linear-gradient(90deg,#ff8c00,#ffb300);
}

header h1{
margin:0;
font-size:38px;
letter-spacing:2px;
}

header p{
margin-top:6px;
opacity:.9;
}

.container{
max-width:1100px;
margin:auto;
padding:35px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
}

.card{
background:#1c1c1c;
border-radius:14px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.6);
cursor:pointer;
transition:.3s;
}

.card:hover{
transform:translateY(-8px) scale(1.03);
box-shadow:0 15px 40px rgba(0,0,0,0.9);
}

.card img{
width:100%;
height:190px;
object-fit:cover;
}

.content{
padding:18px;
}

.content h3{
margin:0 0 8px;
color:#ffb300;
}

.content p{
margin:0;
color:#ccc;
font-size:14px;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.85);
align-items:center;
justify-content:center;
padding:20px;
}

.modal-box{
background:#1b1b1b;
max-width:650px;
width:100%;
border-radius:10px;
padding:30px;
animation:fade .25s;
}

.modal-box h2{
color:#ffb300;
margin-top:0;
}

.modal-box p{
color:#ddd;
line-height:1.6;
}

.close{
margin-top:20px;
padding:10px 22px;
background:#ff9800;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}

.close:hover{
background:#ff6f00;
}

@keyframes fade{
from{opacity:0;transform:scale(.9)}
to{opacity:1;transform:scale(1)}
}

</style>
</head>

<body>

<header>
<h1>MANIFESTAÇÕES CULTURAIS</h1>
<p>Ribeira do Pombal • Bahia</p>
</header>

<div class="container">

<div class="card" onclick="abrir('festas')">
<img src="https://upload.wikimedia.org/wikipedia/commons/3/3d/Festa_junina_quadrilha.jpg">
<div class="content">
<h3>Festas Tradicionais</h3>
<p>Eventos populares que movimentam a cultura da cidade.</p>
</div>
</div>

<div class="card" onclick="abrir('culinaria')">
<img src="https://upload.wikimedia.org/wikipedia/commons/5/52/Carne_de_sol_com_cuscuz.jpg">
<div class="content">
<h3>Culinária Típica</h3>
<p>Sabores fortes do sertão baiano.</p>
</div>
</div>

<div class="card" onclick="abrir('historia')">
<img src="https://upload.wikimedia.org/wikipedia/commons/7/70/Povo_Kiriri.jpg">
<div class="content">
<h3>Raízes e Costumes</h3>
<p>Influência indígena e tradição religiosa.</p>
</div>
</div>

<div class="card" onclick="abrir('musica')">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Forro_dance.jpg">
<div class="content">
<h3>Música e Dança</h3>
<p>Forró, quadrilha e cultura nordestina.</p>
</div>
</div>

</div>

<div class="modal" id="modal">
<div class="modal-box" id="texto"></div>
</div>

<script>

function abrir(tipo){

let dados={

festas:`
<h2>Festas Tradicionais</h2>

<p>
Em Ribeira do Pombal, as festas populares são uma das maiores
expressões culturais da cidade. Entre os principais eventos estão
as festas religiosas, comemorações juninas e eventos culturais
realizados na praça e em espaços públicos.
</p>

<p>
Durante essas celebrações acontecem apresentações musicais,
quadrilhas, comidas típicas e atividades culturais que reúnem
moradores e visitantes da região.
</p>

<p>
Esses eventos ajudam a fortalecer a identidade cultural
do município e mantêm vivas as tradições do interior da Bahia.
</p>

<button class="close" onclick="fechar()">Fechar</button>
`,

culinaria:`
<h2>Culinária Típica</h2>

<p>
A culinária de Ribeira do Pombal é influenciada pelos costumes
do sertão baiano. Os pratos são simples, porém muito saborosos
e preparados com ingredientes tradicionais da região.
</p>

<p>
Entre os mais conhecidos estão o cuscuz sertanejo,
carne de sol, bode assado, feijão de corda e diversos pratos
feitos com milho, principalmente durante festas juninas.
</p>

<p>
A comida típica representa muito da cultura local e costuma
estar presente em feiras, festas populares e reuniões familiares.
</p>

<button class="close" onclick="fechar()">Fechar</button>
`,

historia:`
<h2>Raízes e Costumes</h2>

<p>
A história cultural da região tem forte influência dos povos
indígenas, especialmente do povo Kiriri, que habita áreas da
Bahia há muitos séculos.
</p>

<p>
Além das raízes indígenas, a religiosidade católica também
marcou profundamente a cultura local, com celebrações,
procissões e festas religiosas que fazem parte da tradição
da população.
</p>

<p>
Essas influências ajudaram a formar os costumes, valores
e tradições que fazem parte da identidade cultural
de Ribeira do Pombal.
</p>

<button class="close" onclick="fechar()">Fechar</button>
`,

musica:`
<h2>Música e Dança</h2>

<p>
A música é uma das manifestações culturais mais presentes
na região. O forró é o ritmo mais popular, especialmente
durante as festas juninas e eventos comunitários.
</p>

<p>
As quadrilhas juninas também fazem parte dessa tradição,
com danças coreografadas, figurinos coloridos e apresentações
que envolvem jovens e adultos da comunidade.
</p>

<p>
Além disso, bandas e grupos musicais locais contribuem
para manter viva a cultura musical nordestina na cidade.
</p>

<button class="close" onclick="fechar()">Fechar</button>
`
}

document.getElementById("texto").innerHTML=dados[tipo]
document.getElementById("modal").style.display="flex"

}

function fechar(){
document.getElementById("modal").style.display="none"
}

</script>

</body>
</html>
